<!doctype html>
<html data-theme="dark"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minipass</title>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">mini<span>pass</span></div>
    <nav>
      <button class="navitem active" data-view="websites" onclick="showView('websites')">Websites</button>
      <button class="navitem" data-view="files" onclick="showView('files')">Files</button>
      <button class="navitem" data-view="terminal" onclick="showView('terminal')">Terminal</button>
      <button class="navitem" data-view="logs" onclick="showView('logs')">Logs</button>
      <button class="navitem" data-view="panel" onclick="showView('panel')">Upgrade</button>
    </nav>
    <div class="sidefoot"><button onclick="toggleTheme()" title="dark / light mode">Theme</button></div>
  </aside>
  <main>
    <section id="view-websites" class="view active">
      <div class="pagehead"><h1>Websites</h1><button class="btn primary" onclick="openCreate()">+ Create</button></div>
      <div id="apps"></div>
    </section>
    <section id="view-files" class="view">
      <div class="pagehead"><h1>Files</h1></div>
      <div class="card">
        <select id="fileApp" onchange="listFiles('')"></select>
        <button onclick="listFiles('')">list files</button>
        <div id="fileList"></div>
        <input id="filePath" placeholder="path (index.html)" style="width:240px">
        <button onclick="openFile()">open</button>
        <button onclick="saveFile()">save + redeploy</button>
        <button class="btn danger" onclick="deleteFile()">delete + redeploy</button><br>
        <textarea id="fileEdit" rows="12"></textarea><br>
        <input type="file" id="zipFile" accept=".zip"><button onclick="uploadZip()">upload zip + redeploy</button><br>
        <input type="file" id="pickFiles" multiple><button onclick="uploadPicked(false)">upload files + redeploy</button><br>
        <input type="file" id="pickFolder" webkitdirectory><button onclick="uploadPicked(true)">upload folder + redeploy</button>
        <pre id="fileOut"></pre>
      </div>
    </section>
    <section id="view-terminal" class="view">
      <div class="pagehead"><h1>Terminal</h1></div>
      <div class="card">
        <select id="termApp"></select>
        <button onclick="openTerm()">connect ssh/terminal</button>
        <div id="term"></div>
      </div>
    </section>
    <section id="view-logs" class="view">
      <div class="pagehead"><h1>Logs</h1></div>
      <div class="card">
        <select id="logApp"></select>
        <button onclick="showLogs()">logs</button>
        <pre id="logs"></pre>
      </div>
    </section>
    <section id="view-panel" class="view">
      <div class="pagehead"><h1>Upgrade</h1></div>
      <div class="card"><b>panel</b> <span id="ver">…</span><br>
        <button onclick="upgrade()">Upgrade from git</button>
        <button onclick="scan()">rescan /srv/apps</button>
        <pre id="upOut"></pre>
      </div>
    </section>
  </main>
</div>
<div id="modal" class="modal"><div class="modalbox">
  <h2>New website</h2>
  <label>App name<input id="name" placeholder="myapp"></label>
  <label>Type</label>
  <div class="typerow">
    <label class="typepill"><input type="radio" name="apptype" value="static" checked><b>Static</b>html / files</label>
    <label class="typepill"><input type="radio" name="apptype" value="react"><b>React</b>build + serve</label>
    <label class="typepill"><input type="radio" name="apptype" value="node"><b>Node.js</b>server app</label>
    <label class="typepill"><input type="radio" name="apptype" value="php"><b>PHP</b>apache app</label>
  </div>
  <label>Database<select id="db"><option value="none">no db</option><option value="postgres">postgres</option><option value="mysql">mysql</option><option value="mongo">mongo</option><option value="redis">redis</option></select></label>
  <label>Git repo url (optional)<input id="repo" placeholder="https://github.com/you/site.git"></label>
  <label>Domain (optional)<input id="domain" placeholder="app.example.com"></label>
  <div class="modalbtns"><button class="btn primary" onclick="createApp()">Build</button><button onclick="closeCreate()">Cancel</button></div>
  <pre id="out"></pre>
</div></div>
<script src="app.js"></script>
</body></html>
