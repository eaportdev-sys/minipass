<!doctype html>
<html><head><meta charset="utf-8"><title>minipaas</title>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<style>body{font-family:system-ui;background:#0f1115;color:#eee;margin:0;padding:20px}input,select,button{padding:8px;margin:4px}button{cursor:pointer}.card{border:1px solid #333;padding:12px;margin:8px 0;border-radius:8px;background:#171a21}#term{height:300px;background:#000}</style>
</head><body>
<h2>minipass - build app</h2>
<div class="card"><b>panel</b> <span id="ver">…</span> <button onclick="upgrade()">Upgrade from git</button> <button onclick="scan()">rescan /srv/apps</button><pre id="upOut"></pre></div>
<div class="card">
<input id="name" placeholder="app name (myapp)">
<select id="type"><option value="static">static</option><option value="react">react</option><option value="node">node js</option><option value="php">php</option></select>
<select id="db"><option value="none">no db</option><option value="postgres">postgres</option><option value="mysql">mysql</option><option value="mongo">mongo</option><option value="redis">redis</option></select><br>
<input id="repo" placeholder="git repo url (optional)" style="width:320px">
<input id="domain" placeholder="domain (app.example.com)" style="width:200px">
<button onclick="createApp()">Build</button>
<pre id="out"></pre>
</div>
<h3>apps</h3><div id="apps"></div>
<h3>terminal</h3>
<select id="termApp"></select><button onclick="openTerm()">connect ssh/terminal</button>
<div id="term"></div>
<h3>logs</h3><select id="logApp"></select><button onclick="showLogs()">logs</button><pre id="logs"></pre>
<h3>files</h3>
<div class="card">
<select id="fileApp" onchange="listFiles('')"></select><button onclick="listFiles('')">list files</button>
<div id="fileList"></div>
<input id="filePath" placeholder="path (index.html)" style="width:240px">
<button onclick="openFile()">open</button>
<button onclick="saveFile()">save + redeploy</button>
<button onclick="deleteFile()">delete + redeploy</button><br>
<textarea id="fileEdit" rows="12" style="width:100%;max-width:800px"></textarea><br>
<input type="file" id="zipFile" accept=".zip"><button onclick="uploadZip()">upload zip + redeploy</button>
<pre id="fileOut"></pre>
</div>
<script src="app.js"></script>
</body></html>
