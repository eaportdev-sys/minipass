name: minipass
services:
  panel:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILDKIT_INLINE_CACHE: 1
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
      - ./backend/.env.example
    environment:
      - APPS_DIR=/srv/apps
      - DATA_FILE=/data/apps.json
      - PORT=3001
      - DOCKER_BUILDKIT=1
      - COMPOSE_DOCKER_CLI_BUILD=1
    volumes:
      - /srv/apps:/srv/apps
      - /srv/panel-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/repo
    ports:
      - "3001:3001"
  # Set TUNNEL_TOKEN, then uncomment. One tunnel serves all apps.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}