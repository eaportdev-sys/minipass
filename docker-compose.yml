services:
  panel:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    restart: unless-stopped
    env_file: ./backend/.env.example
    environment:
      - APPS_DIR=/srv/apps
      - DATA_FILE=/data/apps.json
      - PORT=3001
    volumes:
      - /srv/apps:/srv/apps
      - /srv/panel-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/repo
      # deploy key for private-repo pulls (host ~/.ssh/minipass-deploy, read-only)
      - ${HOME}/.ssh:/root/.ssh:ro
    ports:
      - "3001:3001"
  # Set TUNNEL_TOKEN, then uncomment. One tunnel serves all apps.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
